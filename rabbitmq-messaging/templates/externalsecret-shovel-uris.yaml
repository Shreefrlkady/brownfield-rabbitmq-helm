{{- if and .Values.externalSecret.shovelUris (not .Values.externalSecret.vaultPath) }}
{{- fail "externalSecret.vaultPath must be set (per-env) when externalSecret.shovelUris is non-empty" }}
{{- end }}
{{- range .Values.externalSecret.shovelUris }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ . }}
  namespace: {{ $.Release.Namespace }}
spec:
  refreshInterval: {{ $.Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ $.Values.externalSecret.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ . }}
    creationPolicy: Owner
  # One Vault secret per env (externalSecret.vaultPath) holds all shovel URIs, keyed by
  # per-shovel properties <name>-srcUri / <name>-destUri. The Vault path must exist (with
  # values identical to the live secret) BEFORE this applies, or external-secrets takes
  # ownership of the live secret and fails to populate it.
  data:
    - secretKey: srcUri
      remoteRef:
        key: {{ $.Values.externalSecret.vaultPath }}
        property: {{ printf "%s-srcUri" . }}
    - secretKey: destUri
      remoteRef:
        key: {{ $.Values.externalSecret.vaultPath }}
        property: {{ printf "%s-destUri" . }}
{{- end }}
