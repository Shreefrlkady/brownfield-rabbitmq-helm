apiVersion: v1
kind: ServiceAccount
metadata:
  name: messaging-topology-operator
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: messaging-topology-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: messaging-topology-manager-role
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "get", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rabbitmq.com"]
    resources:
      - bindings
      - exchanges
      - federations
      - operatorpolicies
      - permissions
      - policies
      - queues
      - schemareplications
      - shovels
      - superstreams
      - topicpermissions
      - users
      - vhosts
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["rabbitmq.com"]
    resources:
      - bindings/finalizers
      - exchanges/finalizers
      - federations/finalizers
      - operatorpolicies/finalizers
      - permissions/finalizers
      - policies/finalizers
      - queues/finalizers
      - schemareplications/finalizers
      - shovels/finalizers
      - superstreams/finalizers
      - topicpermissions/finalizers
      - users/finalizers
      - vhosts/finalizers
    verbs: ["update"]
  - apiGroups: ["rabbitmq.com"]
    resources:
      - bindings/status
      - exchanges/status
      - federations/status
      - operatorpolicies/status
      - permissions/status
      - policies/status
      - queues/status
      - schemareplications/status
      - shovels/status
      - superstreams/status
      - topicpermissions/status
      - users/status
      - vhosts/status
    verbs: ["get", "patch", "update"]
  - apiGroups: ["rabbitmq.com"]
    resources: ["rabbitmqclusters"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rabbitmq.com"]
    resources: ["rabbitmqclusters/status"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: messaging-topology-manager-rolebinding
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: messaging-topology-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: messaging-topology-manager-role
subjects:
  - kind: ServiceAccount
    name: messaging-topology-operator
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: messaging-topology-leader-election-role
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: messaging-topology-operator
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: messaging-topology-leader-election-rolebinding
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: messaging-topology-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: messaging-topology-leader-election-role
subjects:
  - kind: ServiceAccount
    name: messaging-topology-operator
    namespace: {{ .Release.Namespace }}
{{- if not .Values.topologyOperator.naming.legacy }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: messaging-topology-metrics-auth-role
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: messaging-topology-metrics-reader
rules:
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: messaging-topology-metrics-auth-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: messaging-topology-metrics-auth-role
subjects:
  - kind: ServiceAccount
    name: messaging-topology-operator
    namespace: {{ .Release.Namespace }}
{{- end }}
